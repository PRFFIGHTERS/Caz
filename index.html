<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ВБ ПВЗ — рабочее место</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --wb: #cb11ab;
    --wb-dark: #a50e8a;
    --bg: #f4f4f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #8b8b9a;
    --line: #e8e8ef;
    --green: #12a05c;
    --blue: #2f6fed;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- header ---------- */
  header {
    background: linear-gradient(100deg, var(--wb), var(--wb-dark));
    color: #fff;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 14px rgba(203, 17, 171, .25);
  }
  .logo {
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -.5px;
    background: rgba(255,255,255,.16);
    padding: 6px 12px;
    border-radius: 10px;
  }
  .pvz-info { line-height: 1.3; }
  .pvz-info .name { font-weight: 700; font-size: 15px; }
  .pvz-info .addr { font-size: 12px; opacity: .8; }
  header .spacer { flex: 1; }
  .shift {
    font-size: 12px;
    background: rgba(255,255,255,.16);
    padding: 8px 12px;
    border-radius: 10px;
    text-align: right;
  }
  .shift b { display: block; font-size: 14px; }

  /* ---------- layout ---------- */
  main { max-width: 920px; margin: 0 auto; padding: 18px 16px 80px; }

  /* ---------- stats ---------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 18px;
  }
  .stat {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    border: 1px solid var(--line);
  }
  .stat .num { font-size: 26px; font-weight: 800; line-height: 1.1; }
  .stat .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .stat.wait .num { color: var(--wb); }
  .stat.transit .num { color: var(--blue); }
  .stat.issued .num { color: var(--green); }

  /* ---------- toolbar ---------- */
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .search {
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  .search input {
    width: 100%;
    padding: 11px 14px 11px 38px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    font-size: 14px;
    outline: none;
  }
  .search input:focus { border-color: var(--wb); }
  .search::before {
    content: "🔍";
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    opacity: .55;
  }
  .btn {
    border: none;
    border-radius: 12px;
    padding: 11px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: .15s;
  }
  .btn-primary { background: var(--wb); color: #fff; }
  .btn-primary:hover { background: var(--wb-dark); }
  .btn-ghost {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text);
  }
  .btn-ghost:hover { border-color: var(--wb); color: var(--wb); }

  /* ---------- tabs ---------- */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    overflow-x: auto;
  }
  .tab {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    color: var(--muted);
    transition: .15s;
  }
  .tab.active {
    background: var(--wb);
    border-color: var(--wb);
    color: #fff;
  }
  .tab .cnt {
    display: inline-block;
    margin-left: 6px;
    background: rgba(0,0,0,.08);
    border-radius: 999px;
    padding: 0 7px;
    font-size: 11px;
  }
  .tab.active .cnt { background: rgba(255,255,255,.28); }

  /* ---------- orders ---------- */
  .order {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    gap: 14px;
    align-items: center;
    animation: fade .25s ease;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }

  .cell {
    flex-shrink: 0;
    width: 62px;
    height: 62px;
    border-radius: 12px;
    background: #f8eef6;
    color: var(--wb);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 15px;
    line-height: 1;
  }
  .cell small {
    font-size: 9px;
    font-weight: 600;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: .5px;
  }

  .order-body { flex: 1; min-width: 0; }
  .order-id {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -.2px;
  }
  .order-meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 999px;
    margin-top: 8px;
  }
  .badge.wait { background: #fbe8f7; color: var(--wb); }
  .badge.transit { background: #e8f0ff; color: var(--blue); }
  .badge.issued { background: #e3f6ec; color: var(--green); }

  .order-actions { flex-shrink: 0; }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 50px 0;
    font-size: 14px;
  }

  /* ---------- modal ---------- */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20, 10, 30, .45);
    backdrop-filter: blur(2px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .backdrop.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 18px;
    width: 100%;
    max-width: 400px;
    padding: 22px;
    animation: pop .2s ease;
  }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } }
  .modal h3 { margin: 0 0 4px; font-size: 18px; }
  .modal .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .modal .code-input {
    width: 100%;
    padding: 14px;
    font-size: 26px;
    text-align: center;
    letter-spacing: 12px;
    border: 2px solid var(--line);
    border-radius: 12px;
    outline: none;
    font-weight: 700;
  }
  .modal .code-input:focus { border-color: var(--wb); }
  .modal .row { display: flex; gap: 10px; margin-top: 16px; }
  .modal .row .btn { flex: 1; }
  .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    text-align: center;
  }
  .success { text-align: center; padding: 10px 0 4px; }
  .success .icon { font-size: 44px; }
  .success h3 { margin: 8px 0; }

  /* ---------- toast ---------- */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translate(-50%, 80px);
    background: #1c1c24;
    color: #fff;
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    transition: .25s;
    z-index: 100;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }

  @media (max-width: 560px) {
    .stats { grid-template-columns: 1fr 1fr; }
    .stat.issued { grid-column: span 2; }
    header { padding: 12px 14px; }
    .shift { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">WB</div>
  <div class="pvz-info">
    <div class="name">ПВЗ Москва, ул. Тверская, 12</div>
    <div class="addr">Пункт выдачи заказов · № 7700123</div>
  </div>
  <div class="spacer"></div>
  <div class="shift">
    Смена
    <b id="shiftClock">—</b>
  </div>
</header>

<main>
  <section class="stats">
    <div class="stat wait">
      <div class="num" id="statWait">0</div>
      <div class="lbl">Ожидают выдачи</div>
    </div>
    <div class="stat transit">
      <div class="num" id="statTransit">0</div>
      <div class="lbl">В пути</div>
    </div>
    <div class="stat issued">
      <div class="num" id="statIssued">0</div>
      <div class="lbl">Выдано сегодня</div>
    </div>
  </section>

  <div class="toolbar">
    <div class="search">
      <input id="search" type="text" placeholder="Номер заказа, клиент или ячейка">
    </div>
    <button class="btn btn-primary" id="btnReceive">+ Принять поставку</button>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="waiting">Ожидают выдачи <span class="cnt" id="cntWaiting">0</span></div>
    <div class="tab" data-tab="transit">В пути <span class="cnt" id="cntTransit">0</span></div>
    <div class="tab" data-tab="issued">Выдано <span class="cnt" id="cntIssued">0</span></div>
  </div>

  <div id="orders"></div>
</main>

<div class="backdrop" id="backdrop">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  // ---------- storage ----------
  const KEY = "wb-pvz-orders";
  const SEED_CELLS = ["A-01","A-02","A-03","A-04","A-05","B-01","B-02","B-03","B-04","C-01","C-02","C-03"];
  const CLIENTS = ["Анна К.","Дмитрий С.","Мария Л.","Игорь П.","Елена В.","Олег Р.","Наталья Ж.","Сергей М.","Юлия Т.","Артём Б.","Ксения Н.","Павел Д."];

  let orders = [];
  let activeTab = "waiting";
  let query = "";

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { orders = JSON.parse(raw); return; }
    } catch (e) {}
    seed();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(orders)); } catch (e) {}
  }
  function seed() {
    orders = [];
    for (let i = 0; i < 10; i++) {
      const status = i < 7 ? "waiting" : "transit";
      orders.push(makeOrder(status));
    }
    save();
  }
  function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
  function pick(arr) { return arr[randInt(0, arr.length - 1)]; }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function makeOrder(status) {
    const d = new Date();
    const arrived = status === "transit"
      ? new Date(d.getTime() + randInt(1, 4) * 86400000)
      : new Date(d.getTime() - randInt(0, 3) * 86400000);
    return {
      id: String(randInt(10000000, 99999999)),
      client: pick(CLIENTS),
      phone: "+7 (9** ) ***-**-" + pad(randInt(10, 99)),
      cell: status === "transit" ? null : pick(SEED_CELLS),
      status: status,
      arrivedAt: arrived.toISOString(),
      issuedAt: null,
      price: randInt(290, 8990)
    };
  }

  // ---------- helpers ----------
  function fmtDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
  }
  function fmtTime(iso) {
    const d = new Date(iso);
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function statusLabel(s) {
    return s === "waiting" ? "Ожидает выдачи" : s === "transit" ? "В пути" : "Выдан";
  }
  function money(n) {
    return n.toLocaleString("ru-RU") + " ₽";
  }
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove("show"), 2200);
  }

  // ---------- render ----------
  function renderStats() {
    const waiting = orders.filter(o => o.status === "waiting").length;
    const transit = orders.filter(o => o.status === "transit").length;
    const issuedToday = orders.filter(o => {
      if (o.status !== "issued" || !o.issuedAt) return false;
      return new Date(o.issuedAt).toDateString() === new Date().toDateString();
    }).length;

    document.getElementById("statWait").textContent = waiting;
    document.getElementById("statTransit").textContent = transit;
    document.getElementById("statIssued").textContent = issuedToday;

    document.getElementById("cntWaiting").textContent = waiting;
    document.getElementById("cntTransit").textContent = transit;
    document.getElementById("cntIssued").textContent = orders.filter(o => o.status === "issued").length;
  }

  function filtered() {
    const q = query.trim().toLowerCase();
    return orders.filter(o => {
      if (o.status !== activeTab) return false;
      if (!q) return true;
      return o.id.includes(q)
        || o.client.toLowerCase().includes(q)
        || (o.cell && o.cell.toLowerCase().includes(q));
    });
  }

  function renderOrders() {
    const list = document.getElementById("orders");
    const items = filtered().sort((a, b) => {
      if (a.status === "issued") return new Date(b.issuedAt || 0) - new Date(a.issuedAt || 0);
      return new Date(a.arrivedAt) - new Date(b.arrivedAt);
    });

    if (!items.length) {
      list.innerHTML = '<div class="empty">Ничего не найдено</div>';
      return;
    }

    list.innerHTML = items.map(o => {
      const cellHtml = o.cell
        ? `<div class="cell">${o.cell}<small>ЯЧЕЙКА</small></div>`
        : `<div class="cell" style="background:#eef1f8;color:#8b8b9a">—<small>В ПУТИ</small></div>`;

      const meta = o.status === "issued"
        ? `${o.client} · выдан ${fmtDate(o.issuedAt)} в ${fmtTime(o.issuedAt)}`
        : `${o.client} · пришёл ${fmtDate(o.arrivedAt)} · ${money(o.price)}`;

      const action = o.status === "waiting"
        ? `<button class="btn btn-primary" data-issue="${o.id}">Выдать</button>`
        : o.status === "transit"
          ? `<button class="btn btn-ghost" disabled>Ожидается</button>`
          : `<button class="btn btn-ghost" disabled>Выдан</button>`;

      return `
        <div class="order">
          ${cellHtml}
          <div class="order-body">
            <div class="order-id">№ ${o.id}</div>
            <div class="order-meta">${meta}</div>
            <span class="badge ${o.status}">${statusLabel(o.status)}</span>
          </div>
          <div class="order-actions">${action}</div>
        </div>`;
    }).join("");
  }

  function render() {
    renderStats();
    renderOrders();
  }

  // ---------- issue flow ----------
  function openIssue(id) {
    const o = orders.find(x => x.id === id);
    if (!o) return;
    const modal = document.getElementById("modal");
    modal.innerHTML = `
      <h3>Выдача заказа</h3>
      <div class="sub">№ ${o.id} · ${o.client} · ячейка ${o.cell}</div>
      <input class="code-input" id="codeInput" type="text" inputmode="numeric"
             maxlength="4" placeholder="••••" autocomplete="off">
      <div class="hint">Введите 4-значный код из приложения клиента</div>
      <div class="row">
        <button class="btn btn-ghost" id="cancelBtn">Отмена</button>
        <button class="btn btn-primary" id="confirmBtn">Подтвердить</button>
      </div>
    `;
    document.getElementById("backdrop").classList.add("show");
    const input = document.getElementById("codeInput");
    setTimeout(() => input.focus(), 50);

    document.getElementById("cancelBtn").onclick = closeModal;
    document.getElementById("confirmBtn").onclick = () => confirmIssue(o.id);
    input.onkeydown = e => { if (e.key === "Enter") confirmIssue(o.id); };
  }

  function confirmIssue(id) {
    const input = document.getElementById("codeInput");
    const code = (input ? input.value : "").trim();
    if (code.length !== 4) {
      if (input) { input.focus(); input.style.borderColor = "#ff5a5a"; }
      toast("Введите 4 цифры кода");
      return;
    }
    const o = orders.find(x => x.id === id);
    if (!o) return;
    o.status = "issued";
    o.issuedAt = new Date().toISOString();
    save();
    render();
    showSuccess(o);
  }

  function showSuccess(o) {
    const modal = document.getElementById("modal");
    modal.innerHTML = `
      <div class="success">
        <div class="icon">✅</div>
        <h3>Заказ выдан</h3>
        <div class="sub">№ ${o.id} · ${o.client} · ячейка ${o.cell}</div>
        <button class="btn btn-primary" id="doneBtn" style="margin-top:18px;width:100%">Готово</button>
      </div>
    `;
    document.getElementById("doneBtn").onclick = closeModal;
    setTimeout(closeModal, 2500);
    toast("Заказ № " + o.id + " выдан");
  }

  function closeModal() {
    document.getElementById("backdrop").classList.remove("show");
  }

  // ---------- receive supply ----------
  function receiveSupply() {
    const n = randInt(3, 6);
    for (let i = 0; i < n; i++) {
      const o = makeOrder("waiting");
      // свободная ячейка, если есть
      const used = new Set(orders.filter(x => x.status === "waiting").map(x => x.cell));
      const free = SEED_CELLS.find(c => !used.has(c));
      o.cell = free || ("D-" + pad(randInt(1, 20)));
      orders.push(o);
    }
    save();
    render();
    toast("Принято заказов: " + n);
  }

  // ---------- events ----------
  document.getElementById("search").addEventListener("input", e => {
    query = e.target.value;
    renderOrders();
  });

  document.getElementById("tabs").addEventListener("click", e => {
    const tab = e.target.closest(".tab");
    if (!tab) return;
    activeTab = tab.dataset.tab;
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tab));
    renderOrders();
  });

  document.getElementById("orders").addEventListener("click", e => {
    const btn = e.target.closest("[data-issue]");
    if (btn) openIssue(btn.dataset.issue);
  });

  document.getElementById("btnReceive").addEventListener("click", receiveSupply);

  document.getElementById("backdrop").addEventListener("click", e => {
    if (e.target.id === "backdrop") closeModal();
  });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
  });

  // clock
  function tick() {
    const d = new Date();
    document.getElementById("shiftClock").textContent =
      pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  }
  setInterval(tick, 1000);
  tick();

  // ---------- boot ----------
  load();
  render();
})();
</script>
</body>
</html>
