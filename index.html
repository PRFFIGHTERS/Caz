<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WB PVZ — Выдача</title>
<style>
  /* === БАЗА И ПЕРЕМЕННЫЕ === */
  :root {
    /* Тёмно-синяя палитра вместо фирменного фиолетового */
    --accent: #17325c;       /* Основной тёмно-синий */
    --accent-light: #e5ecf5; /* Светлый фон для кнопок */
    --accent-hover: #0f233f; /* Для ховера */
    
    --bg-main: #f0f2f5;
    --bg-panel: #ffffff;
    --bg-sidebar: #ffffff;
    
    --text-main: #1a1a1a;
    --text-muted: #7a8596;
    --border-color: #e0e4ea;
    --border-focus: #17325c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-main);
    color: var(--text-main);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* === ЛЕВЫЙ САЙДБАР === */
  .sidebar {
    width: 80px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 0;
    z-index: 10;
  }
  .sidebar-logo {
    width: 48px;
    height: 48px;
    background: #f4f6f9;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }
  .sidebar-info {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.4;
    margin-bottom: 30px;
  }
  .sidebar-icon {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 10px;
    margin-bottom: 10px;
  }
  .sidebar-icon:hover { background: var(--bg-main); color: var(--accent); }
  .sidebar-bottom { margin-top: auto; }

  /* === ОСНОВНАЯ ЧАСТЬ (Справа от сайдбара) === */
  .main-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* === ВЕРХНЕЕ МЕНЮ === */
  .topbar {
    height: 70px;
    background: var(--bg-sidebar);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 30px;
    z-index: 9;
  }
  .topbar-icons { display: flex; gap: 20px; align-items: center; color: var(--text-muted); }
  .topbar-icons svg { width: 24px; height: 24px; cursor: pointer; }
  .topbar-icons svg:hover { color: var(--accent); }
  
  .topbar-tabs {
    display: flex;
    height: 100%;
    gap: 20px;
    flex: 1;
  }
  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 10px;
    cursor: pointer;
    color: var(--text-muted);
    position: relative;
    font-size: 13px;
    font-weight: 500;
    transition: color 0.2s;
  }
  .tab svg { width: 24px; height: 24px; margin-bottom: 6px; }
  .tab:hover { color: var(--accent); }
  .tab.active {
    color: var(--accent);
  }
  .tab.active::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--accent);
    border-radius: 3px 3px 0 0;
  }
  .tab-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    font-weight: bold;
    padding: 2px 5px;
    border-radius: 8px;
  }
  .topbar-right { display: flex; gap: 16px; align-items: center; color: var(--text-muted); }
  .topbar-right svg { width: 22px; height: 22px; cursor: pointer; }
  .topbar-right svg:hover { color: var(--accent); }

  /* === КОНТЕНТ === */
  .content-area {
    display: flex;
    flex: 1;
    padding: 24px;
    gap: 24px;
    overflow-y: auto;
  }

  /* --- Центральная панель --- */
  .center-panel {
    flex: 1;
    background: var(--bg-panel);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    position: relative;
  }

  .page-title {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--text-main);
  }
  .page-subtitle {
    font-size: 16px;
    color: var(--text-main);
    margin-bottom: 40px;
  }

  /* Иллюстрация сканера (Гибрид: SVG) */
  .scanner-illustration {
    width: 300px;
    height: 220px;
    margin-bottom: 20px;
    position: relative;
  }

  .divider-text {
    font-size: 14px;
    color: var(--text-muted);
    margin: 10px 0 15px;
  }
  
  .input-label {
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 12px;
  }

  .phone-input {
    width: 100%;
    max-width: 360px;
    padding: 16px;
    font-size: 16px;
    text-align: center;
    border: 1.5px solid var(--border-color);
    border-radius: 12px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    color: var(--text-main);
    background: var(--bg-panel);
  }
  .phone-input::placeholder { color: #a0aab8; }
  .phone-input:focus { 
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px rgba(23, 50, 92, 0.1);
  }

  .link-btn {
    margin-top: 30px;
    background: none;
    border: none;
    color: var(--accent);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    padding: 10px;
  }
  .link-btn:hover { text-decoration: underline; }

  /* --- Правая панель (Сертификаты) --- */
  .right-panel {
    width: 320px;
    background: var(--bg-panel);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    padding: 30px 24px;
    display: flex;
    flex-direction: column;
  }
  .right-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .right-subtitle {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.5;
    margin-bottom: 24px;
    text-align: center;
  }

  /* Плашка с логотипом (Темно-синяя) */
  .cert-card {
    background: var(--accent);
    border-radius: 16px;
    padding: 30px 20px;
    text-align: center;
    color: #fff;
    margin-bottom: 30px;
  }
  .cert-logo {
    font-size: 56px;
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 1;
    margin-bottom: 8px;
  }
  .cert-text {
    font-size: 13px;
    opacity: 0.9;
  }

  /* QR-код (Гибрид: SVG) */
  .qr-container {
    display: flex;
    justify-content: center;
    margin-bottom: 30px;
  }
  .qr-svg {
    width: 160px;
    height: 160px;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    transition: background 0.2s;
    margin-bottom: 16px;
  }
  .btn-primary:hover { background: var(--accent-hover); }

  .right-bottom-link {
    text-align: center;
    font-size: 14px;
    color: var(--text-muted);
    cursor: pointer;
  }
  .right-bottom-link:hover { color: var(--accent); text-decoration: underline; }

</style>
</head>
<body>

  <!-- ЛЕВЫЙ САЙДБАР -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <!-- Иконка куба (SVG) -->
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
        <line x1="12" y1="22.08" x2="12" y2="12"></line>
      </svg>
    </div>
    <div class="sidebar-info">
      ID 318205<br>V1.12.0
    </div>
    
    <div class="sidebar-bottom">
      <div class="sidebar-icon">
        <!-- Иконка профиля -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
    </div>
  </aside>

  <!-- ОСНОВНАЯ ЧАСТЬ -->
  <div class="main-wrapper">
    
    <!-- ВЕРХНЕЕ МЕНЮ -->
    <header class="topbar">
      <div class="topbar-icons">
        <!-- Бургер -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        <!-- Корзина -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        <!-- Поиск -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </div>

      <div class="topbar-tabs">
        <div class="tab active">
          <!-- Иконка сканера -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"></path><path d="M9 20h6"></path><path d="M12 4v16"></path></svg>
          Выдача
        </div>
        <div class="tab">
          <!-- Иконка коробки -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
          Приёмка
        </div>
        <div class="tab">
          <!-- Иконка возврата -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          Возврат
          <span class="tab-badge">5</span>
        </div>
        <div class="tab">
          <!-- Иконка доставки -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
          Доставки
        </div>
        <div class="tab">
          <!-- Иконка "Еще" -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          Еще
        </div>
      </div>

      <div class="topbar-right">
        <!-- Справка -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        <!-- Обновление -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        <!-- Чат -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      </div>
    </header>

    <!-- ЗОНА КОНТЕНТА -->
    <main class="content-area">
      
      <!-- ЦЕНТРАЛЬНАЯ ПАНЕЛЬ -->
      <section class="center-panel">
        <h1 class="page-title">Выдача</h1>
        <p class="page-subtitle">Отсканируйте QR-код клиента или курьера</p>

        <!-- Иллюстрация: Сканер и QR (SVG) -->
        <div class="scanner-illustration">
          <svg viewBox="0 0 300 220" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- QR Код слева -->
            <g stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <!-- Внешние углы -->
              <path d="M40 80V50H70" />
              <path d="M120 50H150V80" />
              <path d="M150 120V150H120" />
              <path d="M70 150H40V120" />
              <!-- Внутренние квадраты -->
              <rect x="60" y="70" width="15" height="15" fill="var(--accent)" />
              <rect x="110" y="70" width="15" height="15" fill="var(--accent)" />
              <rect x="60" y="115" width="15" height="15" fill="var(--accent)" />
              
              <!-- Рандомные точки -->
              <rect x="85" y="70" width="8" height="8" fill="var(--accent)" />
              <rect x="85" y="90" width="8" height="8" fill="var(--accent)" />
              <rect x="110" y="90" width="8" height="8" fill="var(--accent)" />
              <rect x="85" y="115" width="8" height="8" fill="var(--accent)" />
              <rect x="110" y="115" width="8" height="8" fill="var(--accent)" />
              <rect x="125" y="100" width="8" height="8" fill="var(--accent)" />
              <rect x="40" y="100" width="8" height="8" fill="var(--accent)" />
            </g>

            <!-- Луч сканера (синий) -->
            <polygon points="160,90 220,60 220,140" fill="url(#scanGradient)" opacity="0.4" />
            <defs>
              <linearGradient id="scanGradient" x1="160" y1="100" x2="220" y2="100" gradientUnits="userSpaceOnUse">
                <stop stop-color="var(--accent)" />
                <stop offset="1" stop-color="var(--accent)" stop-opacity="0" />
              </linearGradient>
            </defs>

            <!-- Сканер (3D-стиль контуром) -->
            <g stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round">
              <!-- Рукоятка -->
              <path d="M230 150 L250 190 C252 194, 248 198, 244 198 L220 180 Z" fill="#f0f4fa" />
              <!-- Тело -->
              <path d="M170 80 L220 60 C230 56, 240 60, 245 70 L260 100 C265 110, 260 120, 250 125 L200 145 C190 149, 180 145, 175 135 Z" fill="#f0f4fa" />
              <!-- Носовая часть -->
              <path d="M170 80 L180 110 L200 145" fill="#e5ecf5" />
              <path d="M175 135 L160 100" stroke-width="3" />
            </g>
          </svg>
        </div>

        <div class="divider-text">или</div>
        <div class="input-label">введите его номер телефона</div>
        
        <!-- Нативный HTML инпут для ввода -->
        <input type="text" class="phone-input" placeholder="Последние 4 цифры номера" maxlength="4" inputmode="numeric">

        <button class="link-btn">Выдать из отмены</button>
      </section>

      <!-- ПРАВАЯ ПАНЕЛЬ (Сертификаты) -->
      <aside class="right-panel">
        <h2 class="right-title">Выдача сертификата</h2>
        <p class="right-subtitle">Отсканируйте QR-код либо нажмите на кнопку «Выдать сертификат»</p>

        <!-- Плашка WB (Темно-синяя, без рекламы) -->
        <div class="cert-card">
          <div class="cert-logo">wb</div>
          <div class="cert-text">подарочный сертификат</div>
        </div>

        <!-- QR-код сертификата (SVG) -->
        <div class="qr-container">
          <svg class="qr-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="100" height="100" fill="white"/>
            <g fill="#000">
              <!-- Углы QR -->
              <path d="M10 10h20v20H10z M15 15h10v10H15z" fill-rule="evenodd" clip-rule="evenodd"/>
              <path d="M70 10h20v20H70z M75 15h10v10H75z" fill-rule="evenodd" clip-rule="evenodd"/>
              <path d="M10 70h20v20H10z M15 75h10v10H15z" fill-rule="evenodd" clip-rule="evenodd"/>
              <!-- Рандомные пиксели -->
              <rect x="40" y="10" width="10" height="10"/>
              <rect x="50" y="20" width="10" height="10"/>
              <rect x="40" y="30" width="20" height="10"/>
              <rect x="70" y="40" width="10" height="20"/>
              <rect x="10" y="40" width="10" height="10"/>
              <rect x="20" y="50" width="10" height="10"/>
              <rect x="40" y="50" width="10" height="20"/>
              <rect x="60" y="60" width="20" height="10"/>
              <rect x="40" y="80" width="20" height="10"/>
              <rect x="70" y="80" width="10" height="10"/>
              <rect x="80" y="70" width="10" height="20"/>
              <rect x="20" y="80" width="10" height="10"/>
            </g>
          </svg>
        </div>

        <button class="btn-primary">Выдать сертификат</button>
        <div class="right-bottom-link">Проверить сертификат</div>
      </aside>

    </main>
  </div>

</body>
</html>
