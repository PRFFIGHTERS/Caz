<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WB PVZ — Управление пунктом выдачи</title>
<style>
:root{
  --primary:#7C3AED;
  --primary-dark:#6D28D9;
  --primary-light:#A78BFA;
  --primary-bg:#F5F3FF;
  --bg:#F7F7F9;
  --surface:#FFFFFF;
  --border:#E5E7EB;
  --border-strong:#D1D5DB;
  --text:#1F2937;
  --text-secondary:#6B7280;
  --text-muted:#9CA3AF;
  --success:#10B981;
  --danger:#EF4444;
  --warning:#F59E0B;
  --radius:10px;
  --radius-sm:6px;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg:0 12px 32px rgba(0,0,0,0.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;color:inherit;}

/* Top nav */
.topnav{
  height:56px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 20px;
  gap:32px;
  position:relative;
  z-index:10;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:700;
  font-size:16px;
  color:var(--text);
  flex-shrink:0;
}
.brand svg{color:var(--primary);}
.tabs{
  display:flex;
  gap:4px;
  flex:1;
  height:100%;
  align-items:stretch;
}
.tab{
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 16px;
  color:var(--text-secondary);
  font-size:14px;
  font-weight:500;
  border-bottom:2px solid transparent;
  transition:color 0.15s, border-color 0.15s;
  position:relative;
}
.tab:hover{color:var(--text);}
.tab.active{
  color:var(--primary);
  border-bottom-color:var(--primary);
}
.tab svg{width:18px;height:18px;}
.topnav-right{
  display:flex;
  align-items:center;
  gap:8px;
}
.icon-btn{
  width:36px;height:36px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  color:var(--text-secondary);
  transition:background 0.15s, color 0.15s;
}
.icon-btn:hover{background:var(--bg);color:var(--text);}

/* Layout */
.content{
  display:flex;
  height:calc(100vh - 56px);
  overflow:hidden;
}
.sidebar{
  width:260px;
  background:var(--surface);
  border-right:1px solid var(--border);
  overflow-y:auto;
  padding:16px;
  flex-shrink:0;
}
.main{
  flex:1;
  overflow-y:auto;
  padding:24px 28px;
}

/* Sidebar blocks */
.sb-section{margin-bottom:20px;}
.sb-title{
  font-size:11px;
  font-weight:600;
  color:var(--text-muted);
  text-transform:uppercase;
  letter-spacing:0.5px;
  margin-bottom:8px;
  padding:0 8px;
}
.sb-stat{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 12px;
  border-radius:8px;
  margin-bottom:4px;
  font-size:13px;
  color:var(--text-secondary);
  transition:background 0.15s;
}
.sb-stat:hover{background:var(--bg);}
.sb-stat .val{
  font-weight:600;
  color:var(--text);
  font-size:14px;
}
.sb-stat .val.primary{color:var(--primary);}
.sb-stat .val.warning{color:var(--warning);}
.sb-stat .val.success{color:var(--success);}
.sb-hint{
  font-size:12px;
  color:var(--text-muted);
  padding:8px 12px;
  line-height:1.5;
}

/* Page headers */
.page-header{margin-bottom:20px;}
.page-title{
  font-size:22px;
  font-weight:700;
  color:var(--text);
  margin-bottom:4px;
}
.page-subtitle{
  font-size:14px;
  color:var(--text-secondary);
}

/* Cards */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:12px;
  box-shadow:var(--shadow-sm);
}
.card.hoverable{transition:box-shadow 0.15s, border-color 0.15s;}
.card.hoverable:hover{box-shadow:var(--shadow-md);border-color:var(--border-strong);}

/* Empty state */
.empty{
  background:var(--surface);
  border:1px dashed var(--border-strong);
  border-radius:var(--radius);
  padding:56px 24px;
  text-align:center;
  color:var(--text-secondary);
}
.empty-icon{
  width:64px;height:64px;
  margin:0 auto 16px;
  color:var(--text-muted);
  opacity:0.5;
}
.empty-title{
  font-size:16px;
  font-weight:600;
  color:var(--text);
  margin-bottom:6px;
}
.empty-text{
  font-size:13px;
  color:var(--text-secondary);
  max-width:400px;
  margin:0 auto;
  line-height:1.6;
}

/* Issue screen */
.issue-hero{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:36px 28px;
  text-align:center;
  box-shadow:var(--shadow-sm);
}
.qr-illustration{
  width:120px;height:120px;
  margin:0 auto 20px;
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
}
.qr-illustration svg{width:100%;height:100%;}
.issue-hero h2{
  font-size:18px;
  font-weight:600;
  margin-bottom:6px;
}
.issue-hero p{
  color:var(--text-secondary);
  font-size:13px;
  margin-bottom:24px;
}
.scan-indicator{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  background:var(--primary-bg);
  color:var(--primary);
  border-radius:20px;
  font-size:12px;
  font-weight:500;
  margin-bottom:24px;
}
.scan-indicator .dot{
  width:8px;height:8px;
  border-radius:50%;
  background:var(--success);
  animation:pulse 1.5s infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:0.5;transform:scale(0.9);}
}
.manual-search{
  max-width:420px;
  margin:0 auto;
  padding-top:20px;
  border-top:1px solid var(--border);
}
.manual-search label{
  display:block;
  font-size:12px;
  color:var(--text-secondary);
  margin-bottom:8px;
  text-align:left;
}
.manual-search-row{
  display:flex;
  gap:8px;
}
.input{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  background:var(--surface);
  font-size:14px;
  transition:border-color 0.15s, box-shadow 0.15s;
  outline:none;
}
.input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(124,58,237,0.1);
}
.input::placeholder{color:var(--text-muted);}

/* Buttons */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:10px 16px;
  border-radius:var(--radius-sm);
  font-size:14px;
  font-weight:500;
  transition:background 0.15s, color 0.15s, border-color 0.15s;
  border:1px solid transparent;
  white-space:nowrap;
}
.btn-primary{
  background:var(--primary);
  color:white;
}
.btn-primary:hover{background:var(--primary-dark);}
.btn-secondary{
  background:var(--surface);
  color:var(--text);
  border-color:var(--border);
}
.btn-secondary:hover{background:var(--bg);border-color:var(--border-strong);}
.btn-danger{
  background:var(--danger);
  color:white;
}
.btn-danger:hover{background:#DC2626;}
.btn-ghost{
  background:transparent;
  color:var(--text-secondary);
}
.btn-ghost:hover{background:var(--bg);color:var(--text);}
.btn-sm{padding:6px 12px;font-size:13px;}
.btn-block{width:100%;}
.btn:disabled{
  opacity:0.5;
  cursor:not-allowed;
}

/* Form */
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.form-grid .full{grid-column:1/-1;}
.form-field label{
  display:block;
  font-size:12px;
  color:var(--text-secondary);
  margin-bottom:6px;
  font-weight:500;
}
.form-actions{
  display:flex;
  gap:8px;
  margin-top:16px;
}

/* Product card */
.product-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:10px;
  display:flex;
  gap:16px;
  transition:border-color 0.15s, box-shadow 0.15s;
}
.product-card:hover{border-color:var(--border-strong);}
.product-cell{
  width:80px;
  height:80px;
  border-radius:var(--radius);
  background:var(--primary-bg);
  color:var(--primary);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.product-cell .cell-label{
  font-size:10px;
  text-transform:uppercase;
  font-weight:600;
  opacity:0.7;
  letter-spacing:0.5px;
}
.product-cell .cell-number{
  font-size:28px;
  font-weight:700;
  line-height:1;
}
.product-info{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.product-name{
  font-weight:600;
  font-size:15px;
  color:var(--text);
  margin-bottom:2px;
  overflow:hidden;
  text-overflow:ellipsis;
}
.product-meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px 16px;
  font-size:12px;
  color:var(--text-secondary);
}
.product-meta .meta-item{
  display:flex;
  align-items:center;
  gap:4px;
}
.product-meta .meta-item svg{
  width:13px;height:13px;
  color:var(--text-muted);
}
.product-actions{
  display:flex;
  flex-direction:column;
  gap:6px;
  align-items:flex-end;
  flex-shrink:0;
}
.status-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.3px;
}
.status-awaiting{background:#FEF3C7;color:#92400E;}
.status-issued{background:#D1FAE5;color:#065F46;}
.status-returning{background:#FEE2E2;color:#991B1B;}
.status-returned{background:#E5E7EB;color:#374151;}
.status-delivering{background:#DBEAFE;color:#1E40AF;}
.status-delivered{background:#D1FAE5;color:#065F46;}

/* Issue card (modal content) */
.issue-card{
  background:var(--surface);
  border-radius:var(--radius);
  width:100%;
  max-width:600px;
  max-height:85vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.issue-header{
  padding:20px 24px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.issue-header h2{
  font-size:18px;
  font-weight:600;
}
.issue-close{
  width:32px;height:32px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:6px;
  color:var(--text-secondary);
  transition:background 0.15s;
}
.issue-close:hover{background:var(--bg);}
.issue-body{
  padding:20px 24px;
  overflow-y:auto;
  flex:1;
}
.issue-client-info{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  background:var(--primary-bg);
  border-radius:var(--radius-sm);
  margin-bottom:16px;
  font-size:13px;
  color:var(--primary);
  font-weight:500;
}
.cell-group{
  margin-bottom:16px;
}
.cell-group-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
  padding:8px 12px;
  background:var(--bg);
  border-radius:var(--radius-sm);
}
.cell-group-header .big-num{
  font-size:22px;
  font-weight:700;
  color:var(--primary);
  min-width:32px;
}
.cell-group-header .label{
  font-size:12px;
  color:var(--text-secondary);
  text-transform:uppercase;
  font-weight:600;
  letter-spacing:0.3px;
}
.cell-group-products{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding-left:8px;
}
.check-product{
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:12px;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  cursor:pointer;
  transition:border-color 0.15s, background 0.15s;
}
.check-product:hover{border-color:var(--primary-light);background:#FAFAFF;}
.check-product input[type="checkbox"]{
  margin-top:3px;
  width:16px;height:16px;
  accent-color:var(--primary);
  cursor:pointer;
  flex-shrink:0;
}
.check-product.selected{border-color:var(--primary);background:var(--primary-bg);}
.check-info{flex:1;min-width:0;}
.check-info .check-name{
  font-weight:600;
  font-size:14px;
  margin-bottom:4px;
}
.check-info .check-meta{
  font-size:12px;
  color:var(--text-secondary);
  display:flex;
  flex-wrap:wrap;
  gap:4px 12px;
}
.issue-footer{
  padding:16px 24px;
  border-top:1px solid var(--border);
  display:flex;
  gap:8px;
  background:var(--surface);
}

/* Modal */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(17,24,39,0.45);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
  animation:fadeIn 0.15s;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{
  background:var(--surface);
  border-radius:var(--radius);
  padding:32px 28px;
  width:100%;
  max-width:420px;
  text-align:center;
  box-shadow:var(--shadow-lg);
  animation:popIn 0.18s;
}
@keyframes popIn{from{transform:scale(0.96);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-icon{
  width:56px;height:56px;
  margin:0 auto 16px;
  border-radius:50%;
  background:#FEE2E2;
  color:var(--danger);
  display:flex;
  align-items:center;
  justify-content:center;
}
.modal-icon svg{width:28px;height:28px;}
.modal h3{
  font-size:18px;
  font-weight:600;
  margin-bottom:8px;
}
.modal p{
  color:var(--text-secondary);
  font-size:14px;
  margin-bottom:24px;
  line-height:1.5;
}
.modal-actions{
  display:flex;
  gap:8px;
  justify-content:center;
}

/* Toast */
.toasts{
  position:fixed;
  top:70px;
  right:20px;
  display:flex;
  flex-direction:column;
  gap:8px;
  z-index:1000;
  max-width:360px;
}
.toast{
  background:var(--surface);
  padding:12px 16px;
  border-radius:var(--radius-sm);
  box-shadow:var(--shadow-md);
  border-left:3px solid var(--success);
  font-size:13px;
  color:var(--text);
  animation:slideIn 0.2s;
  display:flex;
  align-items:center;
  gap:8px;
}
.toast.error{border-left-color:var(--danger);}
.toast.warning{border-left-color:var(--warning);}
@keyframes slideIn{from{transform:translateX(20px);opacity:0;}to{transform:translateX(0);opacity:1;}}

/* Misc */
.list-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
  gap:12px;
  flex-wrap:wrap;
}
.list-title{
  font-size:16px;
  font-weight:600;
}
.list-count{
  display:inline-flex;
  align-items:center;
  padding:2px 8px;
  background:var(--primary-bg);
  color:var(--primary);
  border-radius:12px;
  font-size:12px;
  font-weight:600;
  margin-left:8px;
}
.section-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:16px;
}
.section-card h3{
  font-size:15px;
  font-weight:600;
  margin-bottom:14px;
}
.cells-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
  gap:10px;
}
.cell-box{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:12px;
  text-align:center;
}
.cell-box .num{
  font-size:22px;
  font-weight:700;
  color:var(--primary);
  margin-bottom:2px;
}
.cell-box .cnt{
  font-size:11px;
  color:var(--text-secondary);
}
.cell-box.empty-cell{
  background:var(--bg);
  border-style:dashed;
}
.cell-box.empty-cell .num{color:var(--text-muted);}
.history-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 0;
  border-bottom:1px solid var(--border);
  font-size:13px;
}
.history-item:last-child{border-bottom:none;}
.history-icon{
  width:32px;height:32px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  background:var(--primary-bg);
  color:var(--primary);
}
.history-icon.return{background:#FEE2E2;color:#991B1B;}
.history-icon.accept{background:#FEF3C7;color:#92400E;}
.history-info{flex:1;min-width:0;}
.history-info .title{font-weight:500;font-size:13px;margin-bottom:2px;}
.history-info .sub{font-size:11px;color:var(--text-secondary);}
.history-time{font-size:11px;color:var(--text-muted);flex-shrink:0;}

/* Phone selection modal */
.phone-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
.phone-btn{
  padding:12px 16px;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  text-align:left;
  font-size:14px;
  background:var(--surface);
  transition:border-color 0.15s, background 0.15s;
}
.phone-btn:hover{border-color:var(--primary);background:var(--primary-bg);}
.phone-btn .phone-main{font-weight:600;}
.phone-btn .phone-sub{font-size:12px;color:var(--text-secondary);margin-top:2px;}

/* Responsive */
@media (max-width:900px){
  .sidebar{display:none;}
  .tab span{display:none;}
  .tab{padding:0 12px;}
  .form-grid{grid-template-columns:1fr;}
  .content{flex-direction:column;}
}
@media (max-width:600px){
  .topnav{padding:0 12px;gap:12px;}
  .main{padding:16px;}
  .brand span{display:none;}
}
</style>
</head>
<body>

<div class="topnav" id="topnav"></div>

<div class="content">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>

<div class="toasts" id="toasts"></div>
<div id="modal-root"></div>

<script>
/* ========================================================================
   ICONS
   ======================================================================== */
const ICONS = {
  issue: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg>`,
  reception: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12.01l8.73-5.05"/><path d="M12 22.08V12"/></svg>`,
  return: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>`,

/* ========================================================================
   DATABASE (IndexedDB)
   ======================================================================== */
const DB_NAME = 'wb_pvz_db';
const DB_VERSION = 1;
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('products')) {
        const store = d.createObjectStore('products', { keyPath: 'id', autoIncrement: true });
        store.createIndex('barcode', 'barcode', { unique: false });
        store.createIndex('qr', 'qr', { unique: false });
        store.createIndex('phoneLast4', 'phoneLast4', { unique: false });
        store.createIndex('status', 'status', { unique: false });
        store.createIndex('cell', 'cell', { unique: false });
      }
      if (!d.objectStoreNames.contains('operations')) {
        const store = d.createObjectStore('operations', { keyPath: 'id', autoIncrement: true });
        store.createIndex('timestamp', 'timestamp', { unique: false });
      }
      if (!d.objectStoreNames.contains('settings')) {
        d.createObjectStore('settings', { keyPath: 'key' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbAdd(storeName, data) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    const req = store.add(data);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbPut(storeName, data) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    const req = store.put(data);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbGet(storeName, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const store = tx.objectStore(storeName);
    const req = store.get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbGetAll(storeName) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const store = tx.objectStore(storeName);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

function dbDelete(storeName, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    const req = store.delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

/* ========================================================================
   BUSINESS LOGIC
   ======================================================================== */
async function addProduct(data) {
  const product = {
    name: (data.name || '').trim(),
    article: (data.article || '').trim(),
    barcode: (data.barcode || '').trim(),
    qr: (data.qr || '').trim(),
    size: (data.size || '').trim(),
    color: (data.color || '').trim(),
    cell: String(data.cell || '').trim(),
    phoneLast4: String(data.phoneLast4 || '').trim().slice(-4),
    status: data.status || 'awaiting',
    createdAt: Date.now()
  };
  const id = await dbAdd('products', product);
  await logOperation('accept', { ...product, id });
  return id;
}

async function getAllProducts() {
  return await dbGetAll('products');
}

async function getProductsByStatus(status) {
  const all = await getAllProducts();
  return all.filter(p => p.status === status);
}

async function updateProduct(id, patch) {
  const existing = await dbGet('products', id);
  if (!existing) return null;
  const updated = { ...existing, ...patch };
  await dbPut('products', updated);
  return updated;
}

async function deleteProduct(id) {
  await dbDelete('products', id);
}

async function logOperation(type, product, details = '') {
  const op = {
    type,
    productId: product.id,
    productName: product.name || '',
    article: product.article || '',
    barcode: product.barcode || '',
    cell: product.cell || '',
    phoneLast4: product.phoneLast4 || '',
    details,
    timestamp: Date.now()
  };
  await dbAdd('operations', op);
}

async function getOperations(limit = 100) {
  const all = await dbGetAll('operations');
  return all.sort((a, b) => b.timestamp - a.timestamp).slice(0, limit);
}

async function findAwaitingByQuery(query) {
  const q = String(query || '').trim();
  if (!q) return { products: [], phones: [] };

  const awaiting = await getProductsByStatus('awaiting');

  // Match by barcode or qr
  const byCode = awaiting.filter(p =>
    (p.barcode && p.barcode === q) || (p.qr && p.qr === q)
  );
  if (byCode.length > 0) {
    const phones = [...new Set(byCode.map(p => p.phoneLast4))];
    if (phones.length === 1) {
      return {
        products: awaiting.filter(p => p.phoneLast4 === phones[0]),
        phones: []
      };
    }
    return { products: [], phones };
  }

  // Match by phone suffix (4 digits)
  if (/^\d{4}$/.test(q)) {
    const byPhone = awaiting.filter(p => p.phoneLast4 === q);
    if (byPhone.length > 0) {
      return { products: byPhone, phones: [] };
    }
  }

  return { products: [], phones: [] };
}

async function findAwaitingByPhone(phoneLast4) {
  const awaiting = await getProductsByStatus('awaiting');
  return awaiting.filter(p => p.phoneLast4 === phoneLast4);
}

          <input type="text" class="input" id="manualSearch" placeholder="0000" maxlength="4" inputmode="numeric" autocomplete="off">
          <button class="btn btn-primary" id="manualSearchBtn">${ICONS.search} Найти</button>
        </div>
      </div>
    </div>
  `;

  const input = document.getElementById('manualSearch');
  const btn = document.getElementById('manualSearchBtn');

  input.addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
    state.manualPhoneInput = e.target.value;
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      performManualSearch();
    }
  });

  btn.addEventListener('click', performManualSearch);
}

async function performManualSearch() {
  const query = state.manualPhoneInput.trim();
  if (query.length !== 4) {
    toast('Введите 4 цифры телефона', 'warning');
    return;
  }
  await processQuery(query);
}

async function processQuery(query) {
  if (state.processing) return;
  state.processing = true;
  try {
    const result = await findAwaitingByQuery(query);
    if (result.phones && result.phones.length > 1) {
      showPhoneSelection(result.phones);
    } else if (result.products && result.products.length > 0) {
      showIssueCard(result.products);
    } else {
      showNotFoundModal();
    }
  } catch (err) {
    console.error(err);
    toast('Ошибка поиска', 'error');
  } finally {
    state.processing = false;
  }
}

function showPhoneSelection(phones) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" style="text-align:left;">

      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" data-cancel>Отмена</button>
      </div>

  overlay.querySelectorAll('.phone-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const phone = btn.dataset.phone;
      overlay.remove();
      const products = await findAwaitingByPhone(phone);

  });
  overlay.querySelector('[data-cancel]').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.remove();
  });
}

      </div>
    </div>
  `;
  document.getElementById('modal-root').appendChild(overlay);

  overlay.querySelectorAll('input[data-product-check]').forEach(cb => {
    cb.addEventListener('change', () => {
      const label = cb.closest('.check-product');
      if (cb.checked) label.classList.add('selected');
      else label.classList.remove('selected');
    });
  });

  overlay.querySelector('[data-close]').addEventListener('click', () => {
    overlay.remove();
    resetIssueScreen();
  });

  overlay.querySelector('[data-issue]').addEventListener('click', async () => {
    const checked = [...overlay.querySelectorAll('input[data-product-check]:checked')].map(cb => Number(cb.dataset.productCheck));
    if (checked.length === 0) {
      toast('Выберите хотя бы один товар', 'warning');
      return;
    }
    for (const id of checked) {
      const p = await dbGet('products', id);
      if (p && p.status === 'awaiting') {
        await updateProduct(id, { status: 'issued', issuedAt: Date.now() });
        await logOperation('issue', p, 'Выдан клиенту');
      }
    }
    overlay.remove();
    toast(`Выдано товаров: ${checked.length}`);
    resetIssueScreen();
    await renderSidebar();
  });

  overlay.querySelector('[data-return]').addEventListener('click', async () => {
    const checked = [...overlay.querySelectorAll('input[data-product-check]:checked')].map(cb => Number(cb.dataset.productCheck));
    if (checked.length === 0) {
      toast('Выберите хотя бы один товар', 'warning');
      return;
    }
    for (const id of checked) {
      const p = await dbGet('products', id);
      if (p && p.status === 'awaiting') {
        await updateProduct(id, { status: 'returning', returnStartedAt: Date.now() });
        await logOperation('return', p, 'Оформлен возврат');
      }
    }
    overlay.remove();
    toast(`Оформлен возврат: ${checked.length}`);
    resetIssueScreen();
    await renderSidebar();
  });

function computeCells(products) {
  const cells = {};
  products.forEach(p => {
    if (!p.cell) return;
    if (!cells[p.cell]) cells[p.cell] = [];
    cells[p.cell].push(p);
  });
  return cells;
}

function renderProductCard(p, actions) {
  return `
    <div class="product-card" data-product-card="${p.id}">
      <div class="product-cell">
        <span class="cell-label">Ячейка</span>
        <span class="cell-number">${escapeHtml(p.cell || '—')}</span>
      </div>
      <div class="product-info">
        <div class="product-name">${escapeHtml(p.name || 'Без названия')}</div>
        <div class="product-meta">
          ${p.article ? `<span class="meta-item">${ICONS.barcode} Арт: ${escapeHtml(p.article)}</span>` : ''}
          ${p.barcode ? `<span class="meta-item">Штрихкод: ${escapeHtml(p.barcode)}</span>` : ''}
          ${p.size ? `<span class="meta-item">${ICONS.size} Размер: ${escapeHtml(p.size)}</span>` : ''}
          ${p.color ? `<span class="meta-item">${ICONS.color} Цвет: ${escapeHtml(p.color)}</span>` : ''}
          <span class="meta-item">${ICONS.phone} •••• ${escapeHtml(p.phoneLast4 || '—')}</span>
        </div>
      </div>
      <div class="product-actions">
        <span class="status-badge status-${p.status}">${statusLabel(p.status)}</span>
        ${actions.includes(p.status) ? renderActionButtons(p) : ''}
      </div>
    </div>
  `;
}

function renderActionButtons(p) {
  const btns = [];
  if (p.status === 'awaiting') {
    btns.push(`<button class="btn btn-sm btn-primary" data-action="issue" data-id="${p.id}">${ICONS.check} Выдать</button>`);
    btns.push(`<button class="btn btn-sm btn-secondary" data-action="return" data-id="${p.id}">Возврат</button>`);
  } else if (p.status === 'returning') {
    btns.push(`<button class="btn btn-sm btn-primary" data-action="accept-return" data-id="${p.id}">${ICONS.check} Принять возврат</button>`);
  } else if (p.status === 'delivering') {
    btns.push(`<button class="btn btn-sm btn-primary" data-action="delivered" data-id="${p.id}">${ICONS.check} Доставлено</button>`);
  }
  btns.push(`<button class="btn btn-sm btn-ghost" data-action="delete" data-id="${p.id}" title="Удалить">${ICONS.trash}</button>`);
  return btns.join('');
}

function statusLabel(status) {
  return {
    awaiting: 'Ожидает',
    issued: 'Выдан',
    returning: 'Возврат',
    returned: 'Возвращён',
    delivering: 'В доставке',
    delivered: 'Доставлен'
  }[status] || status;
}

function attachProductCardHandlers(main) {
  main.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const id = Number(btn.dataset.id);
      const action = btn.dataset.action;
      const p = await dbGet('products', id);
      if (!p) return;

      if (action === 'issue') {
        await updateProduct(id, { status: 'issued', issuedAt: Date.now() });
        await logOperation('issue', p, 'Выдан из карточки');
        toast(`Выдан: ${p.name}`);
      } else if (action === 'return') {
        await updateProduct(id, { status: 'returning', returnStartedAt: Date.now() });
        await logOperation('return', p, 'Оформлен возврат');
        toast(`Возврат: ${p.name}`);
      } else if (action === 'accept-return') {
        await updateProduct(id, { status: 'returned', returnedAt: Date.now() });
        await logOperation('returned', p, 'Возврат принят');
        toast(`Возврат принят: ${p.name}`);
      } else if (action === 'delivered') {
        await updateProduct(id, { status: 'delivered', deliveredAt: Date.now() });
        await logOperation('delivered', p, 'Доставлен');
        toast(`Доставлен: ${p.name}`);
      } else if (action === 'delete') {
        if (!confirm('Удалить товар?')) return;
        await deleteProduct(id);
        toast('Товар удалён');
      }
      await renderMain();
      await renderSidebar();
    });
  });
}

/* ========================================================================
   SCANNER (HID Keyboard)
   ======================================================================== */
const scan = {
  buffer: '',
  startTime: 0,
  lastKeyTime: 0
};

function resetScanner() {
  scan.buffer = '';
  scan.startTime = 0;
  scan.lastKeyTime = 0;
}

document.addEventListener('keydown', (e) => {
  if (!state.scanning) return;
  if (state.processing) return;

  // Skip manual input typing
  const target = e.target;
  if (target && target.id === 'manualSearch') return;
  if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA')) return;

  // Skip modifiers
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  const now = Date.now();

  if (e.key === 'Enter') {
    const charCount = scan.buffer.length;
    const duration = now - scan.startTime;
    if (charCount >= 4 && duration > 0) {
      const avgSpeed = duration / charCount;
      if (avgSpeed < 100) {
        e.preventDefault();
        const code = scan.buffer;
        resetScanner();
        processQuery(code);
        return;
      }
    }
    resetScanner();
    return;
  }

  if (e.key.length === 1) {
    const gap = now - scan.lastKeyTime;
    if (gap > 250 || scan.buffer.length === 0) {
      scan.buffer = '';
      scan.startTime = now;
    }
    scan.buffer += e.key;
    scan.lastKeyTime = now;
  }
});

/* ========================================================================
   TOAST
   ======================================================================== */
function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'error' ? ' error' : type === 'warning' ? ' warning' : '');
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = 'opacity 0.3s';
    setTimeout(() => el.remove(), 300);
  }, 3000);
}

/* ========================================================================
   UTILITIES
   ======================================================================== */
function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) {
    return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }
  return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }) + ' ' +
         d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

function groupBy(arr, key) {
  const out = {};
  arr.forEach(x => {
    const k = x[key];
    if (!out[k]) out[k] = [];
    out[k].push(x);
  });
  return out;
}

        <div class="empty-text">Проверьте, разрешено ли браузеру использовать IndexedDB. Возможно, вы открыли файл через file:// — попробуйте через локальный сервер.</div>
      </div>
    `;
  }
}

init();
</script>
